<html> 
    <head>
<!--Esta es la cámara para poder ver y moverme: este fragmento de código déjalo así-->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"> </script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
  </head>
    <body> 
    <a-scene>

<!--Esta es la cámara para poder ver y moverme: este fragmento de código déjalo así-->
   <a-entity movement-controls="speed: 1" position="0 0 10">
    	<a-entity camera position="0 1.6 0"
    	    	   look-controls="pointerLockEnabled: true">
    	</a-entity>
   </a-entity>
      
      
<!--Cargo la imagen 360: sustituye si quieres la URL en el atributo src por tu imagen
(primero debes subir la imagen en assets)-->
      <a-assets>
                <img id="imagen360" src="https://tecnocastilla.neocities.org/assets/plazaMayor.jpg">
            </a-assets>
       	      
         
<!-- Creo un "cielo usando mi imagen 360º"-->
            <a-sky src="#imagen360"
                   rotation="0 0 0"
                   position="0 20 0">
            </a-sky>
      
      <!-- Incluyo las primitivas para crear mi escultura:
  este es el fragmento de código que debes modificar-->
      <a-torus-knot color="#B84A39" arc="180" p="2" q="7" radius="6" radius-tubular="0.15" position="0 10.5 -20" rotation="20 20 0"></a-torus-knot>
     <a-cone color="#B84A39" height="10" radius-bottom="2" radius-top="0.5" position="-1 -3 -21.3"></a-cone>
      </a-scene>
  </body>
  
</html>
